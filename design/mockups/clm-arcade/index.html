<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maquette arcade — Contre-la-montre</title>
    <link rel="stylesheet" href="arcade.css" />
  </head>
  <body>
    <main class="galerie">
      <section class="slot slot--1280" data-slot="1280" aria-label="Cadre 1280">
        <p class="slot__label">Cadre 1280</p>
        <div class="slot__viewport" data-viewport="1280">
          <div class="slot__echelle" data-echelle="1280"></div>
        </div>
      </section>
      <section class="slot slot--360" data-slot="360" aria-label="Cadre 360">
        <p class="slot__label">Cadre 360</p>
        <div class="slot__viewport slot__viewport--360" data-viewport="360"></div>
      </section>
    </main>
    <script src="arcade.js"></script>
  </body>
</html>
